spring.application.name=wishlist-service
server.port=${SERVER_PORT}
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security Configuration
jwt.secret=${JWT_SECRET}

service.order.url=${ORDER_SERVICE_URL}
internal.service.key=${INTERNAL_SERVICE_KEY}

# Service URLs
# Points to Admin Service for design metadata
service.design.url=${DESIGN_SERVICE_URL}

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.com.rdc.wishlist=INFO
logging.level.com.rdc.wishlist.security=DEBUG