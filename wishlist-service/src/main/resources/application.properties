spring.application.name=wishlist-service

# ==========================
# =       SERVER           =
# ==========================
server.port=8093

# ==========================
# =   DATABASE CONFIG      =
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# ==========================
# =   JPA / HIBERNATE      =
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# =         JWT            =
# ==========================
# JWT secret - MUST match Auth Service
jwt.secret=GiyIPHik/GoBi0wEARevwq9A1x/nNqzzg8v2xICuxFU=

# ==========================
# =   SERVICE URLS         =
# ==========================
# Design/Admin Service URL (externalized, not hardcoded)
service.design.url=http://localhost:8080

# ==========================
# =       LOGGING          =
# ==========================
logging.level.com.rdc.wishlist=DEBUG
logging.level.com.rdc.wishlist.security=DEBUG