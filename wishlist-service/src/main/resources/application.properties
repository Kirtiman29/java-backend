spring.application.name=wishlist-service
spring.config.import=optional:file:./env/wishlist-service.env[.properties],optional:file:../env/wishlist-service.env[.properties]
server.port=${SERVER_PORT:8093}
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security Configuration
jwt.secret=${JWT_SECRET:GiyIPHik/GoBi0wEARevwq9A1x/nNqzzg8v2xICuxFU=}

service.order.url=${ORDER_SERVICE_URL:http://localhost:8095}
internal.service.key=${INTERNAL_SERVICE_KEY:ORDER_PAYMENT_BRIDGE_KEY}

# Service URLs
# Points to Admin Service for design metadata
service.design.url=${DESIGN_SERVICE_URL:http://localhost:8080}

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://localhost:3001,http://192.168.0.17:3000,http://192.168.0.17:3001}

# Logging
logging.level.com.rdc.wishlist=INFO
logging.level.com.rdc.wishlist.security=DEBUG
