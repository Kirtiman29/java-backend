server {
    listen 80;
    listen [::]:80;
    server_name www.ruchitadesigncompany.in;

    return 301 https://ruchitadesigncompany.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ruchitadesigncompany.in;

    ssl_certificate /etc/letsencrypt/live/ruchitadesigncompany.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruchitadesigncompany.in/privkey.pem;

    return 301 https://ruchitadesigncompany.in$request_uri;
}

server {
    client_max_body_size 50M;
    server_name ruchitadesigncompany.in www.ruchitadesigncompany.in;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/letsencrypt/live/ruchitadesigncompany.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruchitadesigncompany.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # ======================
    # Static Assets
    # ======================
    location /assets/ {
        alias /var/www/html/assets/;
    }

    location /uploads/ {
        alias /root/rdc/rdc-backend/data/uploads/;
    }

    # ======================
    # Frontend Routing
    # ======================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ======================
    # Reverse Proxy Services
    # ======================

    # Auth Service
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8081/auth/;
        include proxy_params;
    }

    # Admin Service
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8080/api/admin/;
        include proxy_params;
    }

    # Asset Service
    location /api/assets/ {
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # Cart Service
    location /api/cart/ {
        proxy_pass http://127.0.0.1:8091;
        include proxy_params;
    }

    # Payment Service
    location /api/payments/ {
        proxy_pass http://127.0.0.1:8092;
        include proxy_params;
    }

    # Order Service
    location /api/orders/ {
        proxy_pass http://127.0.0.1:8095;
        include proxy_params;
    }

    location = /api/orders {
        return 301 /api/orders/;
    }

    # Wishlist Service
    location /api/wishlist/ {
        proxy_pass http://127.0.0.1:8093/api/wishlist/;
        include proxy_params;
    }

    # Subscription Service
    location /api/subscriptions/ {
        proxy_pass http://127.0.0.1:8094/api/subscriptions/;
        include proxy_params;
    }

    location = /api/subscriptions {
        return 301 /api/subscriptions/;
    }

    # Contact & Public APIs
    location /api/contact/ {
        proxy_pass http://127.0.0.1:8080/api/public/contact;
        include proxy_params;
    }

    location /api/public/ {
        proxy_pass http://127.0.0.1:8080/api/public/;
        include proxy_params;
    }

    location /api/categories/ {
        proxy_pass http://127.0.0.1:8080/api/categories/;
        include proxy_params;
    }

    # ======================
    # SITEMAP (VERY IMPORTANT)
    # ======================

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/sitemap.xml;
        include proxy_params;
    }

    location = /sitemap-pages.xml {
        proxy_pass http://127.0.0.1:8080/sitemap-pages.xml;
        include proxy_params;
    }

    location = /sitemap-products.xml {
        proxy_pass http://127.0.0.1:8080/sitemap-products.xml;
        include proxy_params;
    }

    location = /sitemap-categories.xml {
        proxy_pass http://127.0.0.1:8080/sitemap-categories.xml;
        include proxy_params;
    }
}

# HTTP to HTTPS redirect
server {
    if ($host = www.ruchitadesigncompany.in) {
        return 301 https://$host$request_uri;
    }

    if ($host = ruchitadesigncompany.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name ruchitadesigncompany.in www.ruchitadesigncompany.in;
    return 301 https://$host$request_uri;
}
