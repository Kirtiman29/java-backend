spring.application.name=cart-service
server.port=8091
spring.config.import=optional:file:./env/cart-service.env[.properties],optional:file:../env/cart-service.env[.properties]

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===== SERVICES =====
# Used by AdminServiceClient to validate designs
service.admin.url=${ADMIN_SERVICE_URL:http://localhost:8080}

# ===== JWT =====
# Used by JwtAuthenticationFilter for validation
jwt.secret=${JWT_SECRET:GiyIPHik/GoBi0wEARevwq9A1x/nNqzzg8v2xICuxFU=}
internal.service.key=${INTERNAL_SERVICE_KEY:ORDER_PAYMENT_BRIDGE_KEY}

# ===== CORS =====
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://localhost:3001,http://192.168.0.17:3000,http://192.168.0.17:3001}
