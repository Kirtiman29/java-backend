<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: auto; border: 1px solid #eee; padding: 20px;">

<h2 style="color: #2A2623; border-bottom: 2px solid #2A2623; padding-bottom: 10px;">New Storefront Inquiry 📩</h2>

<p>A new message has been received from the <strong>RDC Textiles</strong> public contact form.</p>

<div style="background-color: #f9f9f9; padding: 20px; border-radius: 8px; margin: 20px 0; border: 1px solid #ddd;">
    <p style="margin: 5px 0;"><strong>Sender Name:</strong> <span th:text="${customerName}" style="color: #2A2623; font-weight: bold;">[Name]</span></p>
    <p style="margin: 5px 0;"><strong>Email Address:</strong> <span th:text="${customerEmail}" style="color: #2A2623; text-decoration: underline;">[Email]</span></p>
</div>

<div style="border-left: 4px solid #2A2623; padding: 15px; background-color: #ffffff; margin: 25px 0; border: 1px solid #eee;">
    <p style="margin: 0; font-size: 0.95em; color: #555; white-space: pre-wrap;" th:text="${customerMessage}">
        [Message Content]
    </p>
</div>

<div style="text-align: center; margin: 30px 0;">
    <a th:href="'mailto:' + ${customerEmail}"
       style="background-color: #2A2623; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
        Reply to Customer
    </a>
</div>

<hr style="border: 0; border-top: 1px solid #eee; margin-top: 30px;">
<p style="font-size: 0.8em; color: #777; text-align: center;">
    &copy; 2026 RDC Industrial Archive. Secure Automated Notification System.
</p>
</body>
</html>
