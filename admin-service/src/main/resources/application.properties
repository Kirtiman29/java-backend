spring.application.name=admin-service
server.port=8080

# Spring Data Source Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ? CRITICAL UPDATE: Changed from 'validate' to 'update'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Internal Bridge URLs
service.asset.url=${ASSET_SERVICE_URL}
service.order.url=${ORDER_SERVICE_URL}
service.payment.url=${PAYMENT_SERVICE_URL}

# Security Settings
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=21600000
internal.service.key=${INTERNAL_SERVICE_KEY}

# CORS Settings
spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.max-age=3600
server.error.include-stacktrace=never

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
rdc.hr.email=${HR_EMAIL}
rdc.contact.email=${CONTACT_US_EMAIL}

# Storage Configuration
app.storage.location=${STORAGE_PATH}