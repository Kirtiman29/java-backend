spring.application.name=admin-service
server.port=8080
server.address=0.0.0.0
spring.config.import=optional:file:./env/admin-service.env[.properties],optional:file:../env/admin-service.env[.properties]

# Spring Data Source Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/admin_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# ? CRITICAL UPDATE: Changed from 'validate' to 'update'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.repair-on-migrate=true
spring.flyway.validate-on-migrate=false

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-part-count=5000

# Internal Bridge URLs
service.asset.url=${ASSET_SERVICE_URL:http://localhost:8090}
service.ai.asset.url=${AI_ASSET_SERVICE_URL:${ASSET_SERVICE_URL:http://localhost:8090}}
service.order.url=${ORDER_SERVICE_URL:http://localhost:8095}
service.cart.url=${CART_SERVICE_URL:http://localhost:8091}
service.wishlist.url=${WISHLIST_SERVICE_URL:http://localhost:8093}
service.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8092}
service.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8094}
service.fastapi.url=${FASTAPI_SERVICE_URL:http://127.0.0.1:8000}

# Security Settings
jwt.secret=${JWT_SECRET:GiyIPHik/GoBi0wEARevwq9A1x/nNqzzg8v2xICuxFU=}
jwt.expiration.ms=21600000
internal.service.key=${INTERNAL_SERVICE_KEY:ORDER_PAYMENT_BRIDGE_KEY}

# CORS Settings
spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://localhost:3001,http://192.168.0.17:3000,http://192.168.0.17:3001}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.max-age=3600
server.error.include-stacktrace=never

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
rdc.hr.email=${HR_EMAIL}
rdc.contact.email=${CONTACT_US_EMAIL}
rdc.newsletter.unsubscribe-url-base=${NEWSLETTER_UNSUBSCRIBE_URL_BASE:http://localhost:8080/api/public/newsletter/unsubscribe}

# Storage Configuration
app.storage.location=${STORAGE_PATH}
