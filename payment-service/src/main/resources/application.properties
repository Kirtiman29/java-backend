spring.application.name=payment-service
server.port=${SERVER_PORT:8096}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rdc_payment_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Razorpay Credentials
razorpay.api.key=${RAZORPAY_API_KEY:rzp_test_default_key}
razorpay.api.secret=${RAZORPAY_API_SECRET:rzp_test_default_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:my_webhook_secret}

# Security
jwt.secret=${JWT_SECRET:my-very-secret-key-that-should-be-at-least-256-bits-long}
internal.service.key=${INTERNAL_SERVICE_KEY:ORDER_PAYMENT_BRIDGE_KEY}

# Microservice URLs
service.order.url=${ORDER_SERVICE_URL:http://localhost:8095}
service.subscription.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8094}

# CORS
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:admin}
spring.mail.password=${SPRING_MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}