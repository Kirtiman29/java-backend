spring.application.name=subscription-service

server.port=${SERVER_PORT:8094}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Spring Data Source Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security Settings
jwt.secret=${JWT_SECRET}
internal.service.key=${INTERNAL_SERVICE_KEY}

service.order.url=${ORDER_SERVICE_URL}
service.payment.url=${PAYMENT_SERVICE_URL}
service.auth.url=${AUTH_SERVICE_URL}

CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}