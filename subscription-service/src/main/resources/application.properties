spring.application.name=subscription-service

server.port=${SERVER_PORT:8094}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Spring Data Source Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security Settings
jwt.secret=${JWT_SECRET}
internal.service.key=${INTERNAL_SERVICE_KEY}

service.order.url=${ORDER_SERVICE_URL}
service.payment.url=${PAYMENT_SERVICE_URL}
service.auth.url=${AUTH_SERVICE_URL}
service.admin.url=${ADMIN_SERVICE_URL:http://localhost:8080}

CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# FastAPI Bitmap Backend URL
service.bitmap.url=${BITMAP_BACKEND_URL:http://localhost:8002}

# Multipart Upload Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
