spring.application.name=asset-service
server.port=8090
server.address=0.0.0.0

# Load local secrets when running from IntelliJ at repo root or Maven inside asset-service.
spring.config.import=optional:file:./env/asset-service.env[.properties],optional:file:../env/asset-service.env[.properties]

# 1. Spring Data Source Configuration
# Using different names for env vars to avoid circular references during local dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/asset_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# 2. JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 3. Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# 4. Security Settings (Satisfies @Value in your Java code)

jwt.secret=${JWT_SECRET_ENV:GiyIPHik/GoBi0wEARevwq9A1x/nNqzzg8v2xICuxFU=}
internal.service.key=${INTERNAL_SERVICE_KEY}

# 5. Service Internal Bridge URLs
service.order.url=${ORDER_SERVICE_URL:http://localhost:8095}
service.admin.url=${ADMIN_SERVICE_URL:http://localhost:8080}

# 6. Storage & CORS
# Satisfies @Value("${CORS_ALLOWED_ORIGINS}") in SecurityConfig
CORS_ALLOWED_ORIGINS=${CORS_ENV:http://localhost:3000,http://localhost:3001,http://192.168.0.17:3000,http://192.168.0.17:3001}
spring.web.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}
app.storage.location=${STORAGE_PATH:./data/uploads/assets}

# 7. Multipart Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
