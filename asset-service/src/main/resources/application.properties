spring.application.name=asset-service

## Server Configuration
server.port=8090

## Spring Data Source and JPA Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/asset_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## Flyway Configuration
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true

## Application Specific Properties (File Storage)
app.storage.location=./data/uploads


# standard spring multipart settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## Spring Security OAuth2 Resource Server (JWT) Configuration
# For local dev, you can disable jwk discovery and use a simple JWT secret if auth-service uses symmetric key.
# In production, configure spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth-service/.well-known/jwks.json
# leave empty to accept anything while testing? Better to configure properly.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=