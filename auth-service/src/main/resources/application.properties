spring.application.name=auth-service

# ==========================
# =       SERVER           =
# ==========================
server.port=8081

# ==========================
# =   DATA SOURCE CONFIG   =
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# ==========================
# =   JPA / HIBERNATE      =
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# =   FLYWAY MIGRATIONS    =
# ==========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ==========================
# =         JWT            =
# ==========================
jwt.issuer=patternbank-auth
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=900000
jwt.refresh.expiration.ms=604800000

# ==========================
# =      ACTUATOR          =
# ==========================
management.endpoints.web.exposure.include=health,info,metrics

# ==========================
# =     GOOGLE OAUTH       =
# ==========================
google.client.id=121636299170-gmk6tc3ubdq543bjolttsa27gucgcf7o.apps.googleusercontent.com

# ==========================
# =   GMAIL SMTP CONFIG    =
# ==========================
# ==========================
#   GMAIL SMTP CONFIG (FIXED)
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Use the exact name from your Environment Variables screenshot
spring.mail.username=mail.ruchitadesigncompany@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=5000
spring.mail.properties.mail.writetimeout=5000

app.email.sender=mail.ruchitadesigncompany@gmail.com

# ====================================
# =      Facebook API Credentials     =
# ====================================
facebook.app.id=1523562502249185
facebook.app.secret=${FACEBOOK_APP_SECRET}

# ==========================
# =     FRONTEND CONFIG    =
# ==========================
frontend.url=https://localhost:3000

# ==========================
# =     THYMELEAF CONFIG   =
# ==========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ==========================
# =       LOGGING          =
# ==========================
logging.level.com.rdc.auth=DEBUG
logging.level.org.springframework.mail=DEBUG

# ? INTERNAL BRIDGE KEY (Must match Order and Payment services)
internal.service.key=ORDER_PAYMENT_BRIDGE_KEY