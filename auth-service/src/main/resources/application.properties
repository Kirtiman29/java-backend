spring.application.name=auth-service
server.port=8081

# ===== DATABASE =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Changed to 'update' so Hibernate creates your missing 'users' table
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== FLYWAY =====
spring.flyway.enabled=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
# Setting token expiration to 30 minutes (1800000 ms) for testing
jwt.expiration.ms=${JWT_EXPIRATION_MS:1800000}
jwt.admin.expiration.ms=${JWT_ADMIN_EXPIRATION_MS:${JWT_EXPIRATION_MS:1800000}}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION_MS}

# ===== FRONTEND =====
frontend.url=${FRONTEND_URL}
app.backend.url=${BACKEND_URL}

# ===== MAIL =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.sender=${EMAIL_SENDER}

# ===== OAUTH =====
google.client.id=${GOOGLE_CLIENT_ID}
facebook.app.secret=${FACEBOOK_APP_SECRET}


# ===== INTERNAL BRIDGE =====
internal.service.key=${INTERNAL_SERVICE_KEY}

# ===== CORS =====
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
