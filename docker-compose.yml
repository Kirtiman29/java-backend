name: ai-textile-java

services:
  auth-service:
    build:
      context: ./auth-service
    image: ai-textile-auth-service:local
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./env/auth-service.env
    environment:
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/auth_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      SERVICE_SUBSCRIPTION_URL: http://subscription-service:8094
      BACKEND_URL: ${AUTH_BACKEND_URL:-http://localhost:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    networks:
      - java-network

  admin-service:
    build:
      context: ./admin-service
    image: ai-textile-admin-service:local
    container_name: admin-service
    restart: unless-stopped
    env_file:
      - ./env/admin-service.env
    environment:
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/admin_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      ASSET_SERVICE_URL: http://asset-service:8090
      AI_ASSET_SERVICE_URL: ${AI_ASSET_SERVICE_URL:-http://host.docker.internal:8090}
      ORDER_SERVICE_URL: http://order-service:8095
      CART_SERVICE_URL: http://cart-service:8091
      WISHLIST_SERVICE_URL: http://wishlist-service:8093
      PAYMENT_SERVICE_URL: http://payment-service:8092
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8094
      FASTAPI_SERVICE_URL: ${FASTAPI_SERVICE_URL:-http://host.docker.internal:8000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    networks:
      - java-network

  asset-service:
    build:
      context: ./asset-service
    image: ai-textile-asset-service:local
    container_name: asset-service
    restart: unless-stopped
    env_file:
      - ./env/asset-service.env
    environment:
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/asset_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      ORDER_SERVICE_URL: http://order-service:8095
      ADMIN_SERVICE_URL: http://admin-service:8080
      STORAGE_PATH: /app/data/uploads/assets
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      - ${JAVA_ASSET_UPLOAD_DIR:-./data/uploads/assets}:/app/data/uploads/assets
    networks:
      - java-network

  cart-service:
    build:
      context: ./cart-service
    image: ai-textile-cart-service:local
    container_name: cart-service
    restart: unless-stopped
    env_file:
      - ./env/cart-service.env
    environment:
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/cart_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      ADMIN_SERVICE_URL: http://admin-service:8080
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8091"
    networks:
      - java-network

  order-service:
    build:
      context: ./order-service
    image: ai-textile-order-service:local
    container_name: order-service
    restart: unless-stopped
    env_file:
      - ./env/order-service.env
    environment:
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/order_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      SERVICE_CART_URL: http://cart-service:8091
      SERVICE_WISHLIST_URL: http://wishlist-service:8093
      SERVICE_AUTH_URL: http://auth-service:8081
      SERVICE_ADMIN_URL: http://admin-service:8080
      SERVICE_PAYMENT_URL: http://payment-service:8092
      SERVICE_SUBSCRIPTION_URL: http://subscription-service:8094
      SERVICE_ASSET_URL: http://asset-service:8090
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8095:8095"
    networks:
      - java-network

  payment-service:
    build:
      context: ./payment-service
    image: ai-textile-payment-service:local
    container_name: payment-service
    restart: unless-stopped
    env_file:
      - ./env/payment-service.env
    environment:
      SERVER_PORT: 8092
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/payment_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      ORDER_SERVICE_URL: http://order-service:8095
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8094
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8092:8092"
    networks:
      - java-network

  subscription-service:
    build:
      context: ./subscription-service
    image: ai-textile-subscription-service:local
    container_name: subscription-service
    restart: unless-stopped
    env_file:
      - ./env/subscription-service.env
    environment:
      SERVER_PORT: 8094
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/subscription_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDER_SERVICE_URL: http://order-service:8095
      PAYMENT_SERVICE_URL: http://payment-service:8092
      ADMIN_SERVICE_URL: http://admin-service:8080
      BITMAP_BACKEND_URL: ${BITMAP_BACKEND_URL:-http://host.docker.internal:8002}
      GEMINI_BACKEND_URL: ${GEMINI_BACKEND_URL:-http://host.docker.internal:8000}
      FASTAPI_RESPONSE_TIMEOUT_SECONDS: ${FASTAPI_RESPONSE_TIMEOUT_SECONDS:-900}
      FASTAPI_MAX_IN_MEMORY_MB: ${FASTAPI_MAX_IN_MEMORY_MB:-512}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8094:8094"
    networks:
      - java-network

  wishlist-service:
    build:
      context: ./wishlist-service
    image: ai-textile-wishlist-service:local
    container_name: wishlist-service
    restart: unless-stopped
    env_file:
      - ./env/wishlist-service.env
    environment:
      SERVER_PORT: 8093
      DB_URL: jdbc:mysql://${JAVA_DB_HOST:-host.docker.internal}:${JAVA_DB_PORT:-3306}/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${JAVA_DB_USERNAME:-root}
      DB_PASSWORD: ${JAVA_DB_PASSWORD:-password}
      DESIGN_SERVICE_URL: http://admin-service:8080
      ORDER_SERVICE_URL: http://order-service:8095
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-ORDER_PAYMENT_BRIDGE_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8093:8093"
    networks:
      - java-network

networks:
  java-network:
    driver: bridge

