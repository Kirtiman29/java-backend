spring.application.name=order-service
server.port=8095
spring.config.import=optional:file:./env/order-service.env[.properties],optional:file:../env/order-service.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security Settings
jwt.secret=${JWT_SECRET:GiyIPHik/GoBi0wEARevwq9A1x/nNqzzg8v2xICuxFU=}
internal.service.key=${INTERNAL_SERVICE_KEY:ORDER_PAYMENT_BRIDGE_KEY}

# Internal Bridge URLs
service.cart.url=${SERVICE_CART_URL:http://localhost:8091}
service.wishlist.url=${SERVICE_WISHLIST_URL:http://localhost:8093}
service.auth.url=${SERVICE_AUTH_URL:http://localhost:8081}
service.admin.url=${SERVICE_ADMIN_URL:http://localhost:8080}
service.payment.url=${SERVICE_PAYMENT_URL:http://localhost:8092}
service.subscription.url=${SERVICE_SUBSCRIPTION_URL:http://localhost:8094}
service.asset.url=${SERVICE_ASSET_URL:http://localhost:8090}

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://localhost:3001,http://192.168.0.17:3000,http://192.168.0.17:3001}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:admin}
spring.mail.password=${SPRING_MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
rdc.accounts.email=${ACCOUNTS_EMAIL:accounts@rdc.com}
# Storage Configuration
app.storage.location=${STORAGE_PATH}
